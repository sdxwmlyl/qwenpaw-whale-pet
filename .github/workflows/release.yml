name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: overlay
          tagName: ${{ github.ref_name }}
          releaseName: "QwenPaw Whale Pet ${{ github.ref_name }}"
          releaseBody: |
            QwenPaw 鲸鱼娘桌宠 v0.1.2。

            ### 重要：不再附带第二个 exe
            - 早期版本用 PyInstaller 打包的 `bridge.exe` 会被 **Windows Defender 误判并隔离删除**（实测 ThreatID 2147731250），装完就失联。
            - 现在状态桥用 **Rust 重写并编进主程序**：只有一个 `whale-pet.exe`，无第二进程、无 PyInstaller 特征，下载安装不再触发误报。

            ### 新增 / 修复
            - **可自由拖动**：改用 Tauri 原生 `start_dragging`，支持 150% 缩放与多屏；位置写入 `%APPDATA%\com.qwenpaw.whalepet\window_pos.txt`，重启回到原处
            - 托盘新增「↖ 移到左上角（躲开审批窗）」「↘ 复位到右下角」
            - 审批提醒：轮询 `GET /api/approval/list`，有待审就响提示音 + 气泡
            - 完成音按会话跟踪 `running → idle`，不会被其它会话拖住
            - 会话详情拉取节流（8 / 15 / 30 秒退避），不再每 2 秒拉 12MB

            安装包见下方 Assets；免安装便携包为 `qwenpaw-whale-pet-win64.zip`（21MB，仅一个 exe）。
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
