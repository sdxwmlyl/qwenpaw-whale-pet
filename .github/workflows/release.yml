name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: overlay
          tagName: ${{ github.ref_name }}
          releaseName: "QwenPaw Whale Pet ${{ github.ref_name }}"
          releaseBody: "QwenPaw 鲸鱼娘桌宠。安装包见下方 Assets（NSIS 安装器）。"
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
