[package]
name = "whale-pet"
version = "1.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
